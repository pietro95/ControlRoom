<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Room – Allarmi</title><link rel="stylesheet" href="/static/style.css"><script src="/static/theme.js"></script></head>
<body><main class="wide">
<div class="banner" id="banner"></div>
<div class="summary"><span><b id="total">–</b> allarmi aperti in <b id="ngroups">–</b> gruppi su <b id="sites">–</b> siti</span>
  <span id="shown"></span><span id="upd"></span></div>
<div class="filters">
  <input id="fq" type="search" placeholder="Cerca sito, oggetto, tipo, descrizione, n° ticket…" autocomplete="off">
  <select id="facq"><option value="">Tutti gli acquedotti</option></select>
  <select id="ftipo"><option value="">Tutti i tipi</option></select>
  <select id="fwait"><option value="">Attivi e in attesa</option><option value="active">Solo attivi</option><option value="waiting">Solo in attesa</option></select>
  <label class="chk"><input id="fflap" type="checkbox"> Solo ripetuti</label>
  <button class="btn sm ghost" id="freset" type="button">Azzera</button>
  <button class="btn sm ghost" id="fexp" type="button">Espandi tutto</button>
</div>
<div class="tablewrap"><table class="alarms">
  <thead><tr id="thead"></tr></thead>
  <tbody id="tbody"></tbody>
</table></div>
</main>
<script src="/static/app.js"></script>
<script>
const COLS = [ // chiave, intestazione, ordinabile
  ["", "", false], ["last", "Ultimo", true], ["first", "Dal", true], ["acquedotto", "Acq.", true],
  ["code", "Sito", true], ["oggetto", "Oggetto", true], ["tipo", "Tipo allarme", true],
  ["descrizione", "Descrizione", true], ["count", "N°", true], ["", "Azioni", false],
];
const store = { // preferenze del singolo operatore: se il browser le blocca, si riparte dai default
  get(k, d) { try { const v = localStorage.getItem("cr." + k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem("cr." + k, JSON.stringify(v)); } catch (_) {} },
};
let me, busy = false, note = null, groups = [];
let sort = store.get("sort", { key: "last", dir: -1 });
const expanded = new Set();

function setBanner(on) {
  const b = $("#banner");
  if (!on) { b.style.display = "none"; return; }
  b.replaceChildren("GLPI non raggiungibile: i dati mostrati potrebbero non essere aggiornati. Usa GLPI direttamente: ",
    h("a", { href: me.glpi_url, target: "_blank", rel: "noopener" }, me.glpi_url));
  b.style.display = "block";
}

function fmtWhen(s) { // oggi -> "09:12"; altri giorni -> "16/11 09:12"
  if (!s) return "";
  const today = new Date().toLocaleDateString("sv-SE"); // AAAA-MM-GG locale
  return s.slice(0, 10) === today ? s.slice(11, 16) : `${s.slice(8, 10)}/${s.slice(5, 7)} ${s.slice(11, 16)}`;
}
const label = (g) => `${g.code}${g.oggetto ? " · " + g.oggetto : ""}`;

async function progress(target, text, wait) {
  busy = true;
  try {
    const r = await api("/api/progress", { body: { ticket_ids: target.ids, note: text, wait } });
    const what = wait === "set" ? "messi in attesa" : wait === "resume" ? "ripresi" : "aggiornati";
    toast(r.ok ? `${target.label}: ${r.done.length} ticket ${what} (restano aperti)` : `${target.label}: ${r.failed.length} NON aggiornati, riprova`);
  } catch (e) { toast("Errore: " + e.message, 6000); }
  busy = false; note = null; load();
}

async function loadHistory(target) {
  try {
    const r = await api("/api/history?ids=" + target.ids.slice(0, 20).join(","));
    target.history = r.rows;
  } catch (e) { target.history = []; target.historyErr = e.message; }
  if (note === target) render();
}

function historyBox(target) {
  if (!target.history) return h("div", { class: "hist mut" }, "Caricamento storico…");
  if (target.historyErr) return h("div", { class: "hist mut" }, "Storico non disponibile: " + target.historyErr);
  if (!target.history.length) return h("div", { class: "hist mut" }, "Nessuna manovra registrata finora.");
  return h("div", { class: "hist" }, h("div", { class: "hist-t" }, "Storico manovre"),
    ...target.history.map((r) => h("div", { class: "hist-r" },
      h("span", { class: "nowrap mut" }, fmtWhen(r.date) + (target.ids.length > 1 ? ` · #${r.ticket}` : "")),
      h("span", { class: "hist-x" }, r.text))));
}

async function resolve(target, outcome, text) {
  busy = true;
  try {
    const r = await api("/api/resolve", { body: { ticket_ids: target.ids, outcome, note: text } });
    toast(r.ok ? `${target.label}: chiusi ${r.done.length} ticket` : `${target.label}: ${r.failed.length} NON chiusi, riprova`);
  } catch (e) { toast("Errore: " + e.message, 6000); }
  busy = false; note = null; load();
}

function actions(target) {
  return h("div", { class: "actions" },
    h("button", { class: "btn sm ok", onclick: (ev) => { ev.stopPropagation(); resolve(target, "rientrato", ""); } }, "Rientrato"),
    h("button", { class: "btn sm warn", onclick: (ev) => { ev.stopPropagation(); note = target; loadHistory(target); render(); } },
      target.waiting ? "Manovra / storico…" : "Manovra…"));
}

function noteRow(target) {
  // l'input sopravvive ai ridisegni (arrivo dello storico): testo e focus non si perdono
  const inp = target.inp || (target.inp = h("input", { placeholder: `Cosa è stato fatto su ${target.label}? (obbligatorio)`, maxlength: 500 }));
  const valid = () => {
    if (inp.value.trim().length >= 3) return true;
    toast("Scrivi cosa hai fatto"); inp.focus(); return false;
  };
  const close = () => valid() && resolve(target, "manovra", inp.value);
  const keep = (wait) => valid() && progress(target, inp.value, wait);
  if (!target.bound) {
    target.bound = true;
    inp.addEventListener("keydown", (e) => { if (e.key === "Escape") { note = null; render(); } });
    setTimeout(() => inp.focus(), 0);
  }
  return h("tr", { class: "noterow" }, h("td", { colspan: COLS.length },
    historyBox(target),
    h("div", { class: "note open" }, inp,
      h("button", { class: "btn sm warn", onclick: close, title: "Registra la manovra e chiude il ticket" }, "Manovra e chiudi"),
      h("button", { class: "btn sm", onclick: () => keep("keep"), title: "Registra la manovra nello storico, il ticket resta aperto" }, "Salva senza chiudere"),
      target.waiting
        ? h("button", { class: "btn sm", onclick: () => keep("resume"), title: "Registra e toglie il ticket dall'attesa" }, "Salva e riprendi")
        : h("button", { class: "btn sm", onclick: () => keep("set"), title: "Registra e mette il ticket In attesa (es. squadra in arrivo, ricambio)" }, "Salva e metti in attesa"),
      h("button", { class: "btn sm ghost", onclick: () => { note = null; render(); } }, "Annulla"))));
}

function matches(g, f) {
  if (f.acq && g.acquedotto !== f.acq) return false;
  if (f.tipo && (g.tipo || "(non indicato)") !== f.tipo) return false;
  if (f.flap && !g.flapping) return false;
  if (f.wait === "active" && g.waiting) return false;
  if (f.wait === "waiting" && !g.waiting_count) return false;
  if (!f.q) return true;
  const hay = [g.code, g.name, g.acquedotto, g.oggetto, g.tipo, g.descrizione,
    ...g.items.map((i) => "#" + i.id + " " + i.descrizione)].join(" ").toLowerCase();
  return f.q.split(/\s+/).every((w) => hay.includes(w));
}

function cmp(a, b) {
  const k = sort.key;
  let x = a[k], y = b[k];
  if (k === "count") return (x - y) * sort.dir;
  x = (x || "").toString().toLowerCase(); y = (y || "").toString().toLowerCase();
  if (!x !== !y) return x ? -1 : 1; // vuoti sempre in fondo
  return x.localeCompare(y, "it", { numeric: true }) * sort.dir || (b.last || "").localeCompare(a.last || "");
}

function filters() {
  return { q: $("#fq").value.trim().toLowerCase(), acq: $("#facq").value, tipo: $("#ftipo").value, flap: $("#fflap").checked, wait: $("#fwait").value };
}

function fillSelect(sel, values) {
  const cur = sel.value;
  sel.replaceChildren(sel.options[0], ...values.map((v) => h("option", { value: v }, v)));
  sel.value = values.includes(cur) ? cur : "";
}

function renderHead() {
  $("#thead").replaceChildren(...COLS.map(([k, t, s]) => {
    if (!s) return h("th", {}, t);
    const arrow = sort.key === k ? (sort.dir > 0 ? " ▲" : " ▼") : "";
    return h("th", { class: "sortable" + (sort.key === k ? " on" : ""), onclick: () => {
      sort = sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: ["last", "first", "count"].includes(k) ? -1 : 1 };
      store.set("sort", sort); render();
    } }, t + arrow);
  }));
}

function render() {
  const f = filters();
  store.set("filters", { acq: f.acq, tipo: f.tipo, flap: f.flap, wait: f.wait });
  renderHead();
  const vis = groups.filter((g) => matches(g, f)).sort(cmp);
  const rows = [];
  for (const g of vis) {
    const open = expanded.has(g.key), multi = g.count > 1;
    const toggle = () => { open ? expanded.delete(g.key) : expanded.add(g.key); render(); };
    const target = note && note.key === g.key ? note : { key: g.key, ids: g.ids, label: label(g), waiting: g.waiting };
    rows.push(h("tr", { class: "grp" + (g.flapping ? " flap" : "") + (multi ? " multi" : "") + (g.waiting ? " waiting" : ""), onclick: multi ? toggle : null },
      h("td", { class: "tog" }, multi ? (open ? "▾" : "▸") : ""),
      h("td", { class: "nowrap" }, fmtWhen(g.last)),
      h("td", { class: "nowrap mut" }, multi ? fmtWhen(g.first) : ""),
      h("td", {}, g.acquedotto),
      h("td", {}, h("div", { class: "code" }, g.code), h("div", { class: "nm" }, g.name)),
      h("td", {}, g.oggetto || h("span", { class: "mut" }, "—")),
      h("td", {}, g.tipo || h("span", { class: "mut" }, "—")),
      h("td", { class: "descr" }, g.waiting_count ? h("span", { class: "badge wait" }, g.waiting ? "In attesa" : `${g.waiting_count} in attesa`) : "",
        g.waiting_count ? " " : "", g.descrizione || h("span", { class: "mut" }, "(nessuna descrizione nel ticket)")),
      h("td", {}, h("span", { class: "badge" + (g.flapping ? " flap" : "") }, String(g.count))),
      h("td", {}, actions(target))));
    if (note && note.key === g.key) rows.push(noteRow(note));
    if (open && multi) for (const it of g.items) {
      const k1 = "#" + it.id;
      const t1 = note && note.key === k1 ? note : { key: k1, ids: [it.id], label: `${g.code} #${it.id}`, waiting: it.waiting };
      rows.push(h("tr", { class: "item" + (it.waiting ? " waiting" : "") },
        h("td", {}), h("td", { class: "nowrap" }, fmtWhen(it.opened)),
        h("td", { colspan: 5 }, h("a", { href: `${me.glpi_url}/front/ticket.form.php?id=${it.id}`, target: "_blank", rel: "noopener" }, "#" + it.id)),
        h("td", { class: "descr" }, it.waiting ? h("span", { class: "badge wait" }, "In attesa") : "", it.waiting ? " " : "",
          it.descrizione || "—"), h("td", {}), h("td", {}, actions(t1))));
      if (note && note.key === k1) rows.push(noteRow(note));
    }
  }
  if (!vis.length) rows.push(h("tr", {}, h("td", { colspan: COLS.length, class: "empty" },
    groups.length ? "Nessun allarme corrisponde ai filtri" : "Nessun allarme aperto")));
  $("#tbody").replaceChildren(...rows);
  const n = vis.reduce((s, g) => s + g.count, 0);
  $("#shown").textContent = vis.length === groups.length ? "" : `· visibili ${n} in ${vis.length} gruppi`;
  $("#fexp").textContent = vis.some((g) => g.count > 1 && !expanded.has(g.key)) ? "Espandi tutto" : "Comprimi tutto";
}

async function load() {
  if (busy || note) return; // non ridisegnare mentre l'operatore scrive
  try {
    const q = await api("/api/queue");
    setBanner(false);
    groups = q.groups;
    $("#total").textContent = q.total; $("#ngroups").textContent = groups.length;
    $("#sites").textContent = new Set(groups.map((g) => g.code)).size;
    $("#upd").textContent = "· agg. " + new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const uniq = (a) => [...new Set(a)].sort((x, y) => x.localeCompare(y, "it"));
    fillSelect($("#facq"), uniq(groups.map((g) => g.acquedotto)));
    fillSelect($("#ftipo"), uniq(groups.map((g) => g.tipo || "(non indicato)")));
    for (const k of [...expanded]) if (!groups.some((g) => g.key === k)) expanded.delete(k);
    render();
  } catch (e) {
    if (e.status === 502) setBanner(true); else toast("Errore: " + e.message);
  }
}

(async () => {
  me = await header("queue");
  const f = store.get("filters", {});
  for (const [id, v] of [["#facq", f.acq], ["#ftipo", f.tipo]]) if (v) $(id).append(h("option", { value: v }, v)), $(id).value = v;
  $("#fflap").checked = !!f.flap;
  $("#fwait").value = f.wait || "";
  let t; $("#fq").addEventListener("input", () => { clearTimeout(t); t = setTimeout(render, 150); });
  for (const id of ["#facq", "#ftipo", "#fflap", "#fwait"]) $(id).addEventListener("change", render);
  $("#freset").addEventListener("click", () => { $("#fq").value = ""; $("#facq").value = ""; $("#ftipo").value = ""; $("#fflap").checked = false; $("#fwait").value = ""; render(); });
  $("#fexp").addEventListener("click", () => {
    const vis = groups.filter((g) => g.count > 1 && matches(g, filters()));
    const all = vis.every((g) => expanded.has(g.key));
    vis.forEach((g) => all ? expanded.delete(g.key) : expanded.add(g.key)); render();
  });
  load(); setInterval(load, me.refresh * 1000);
})();
</script></body></html>
