<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Room – Statistiche</title><link rel="stylesheet" href="/static/style.css"><script src="/static/theme.js"></script>
<style>
  body { display: flex; flex-direction: column; height: 100vh; margin: 0; }
  #frame { flex: 1; width: 100%; border: 0; display: none; }
</style></head>
<body>
<div class="banner" id="banner"></div>
<iframe id="frame" title="Statistiche"></iframe>
<script src="/static/app.js"></script>
<script>
(async () => {
  await header("stats");
  const b = $("#banner"), f = $("#frame");
  try {
    const r = await fetch("/grafana/api/health", { credentials: "same-origin" });
    if (!r.ok) throw new Error(r.status);
    // Grafana segue il tema del portale (parametro theme, letto all'avvio della pagina Grafana)
    // al cambio tema si ricarica la dashboard aperta (stesso pannello, filtri e periodo)
    const load = () => {
      let u;
      try { u = new URL(f.contentWindow.location.href); } catch (_) {}
      if (!u || !u.pathname.startsWith("/grafana/")) u = new URL("/grafana/", location.href);
      u.searchParams.delete("kiosk");  // Grafana vuole "kiosk" senza valore: "kiosk=" non nasconde i menu
      u.searchParams.set("theme", crTheme());
      f.src = u.pathname + "?kiosk&" + u.searchParams;
    };
    load(); f.style.display = "block";
    document.addEventListener("cr-theme", load);
  } catch (_) {
    b.textContent = "Statistiche temporaneamente non disponibili (Grafana non raggiungibile). La coda alert non è interessata.";
    b.style.display = "block";
  }
})();
</script></body></html>
