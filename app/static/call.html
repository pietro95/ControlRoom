<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Room – Nuova chiamata</title><link rel="stylesheet" href="/static/style.css"><script src="/static/theme.js"></script></head>
<body><main style="max-width:760px">
<div class="f"><label for="q">1. Sito</label>
  <div class="combo"><input id="q" role="combobox" aria-expanded="false" aria-controls="q-list" autocomplete="off"
    placeholder="Scegli o scrivi codice / nome (es. FNC-IS00600, Casaleno)"><ul class="combo-list" id="q-list" role="listbox"></ul></div></div>
<div class="f"><label for="uq">2. Chi chiama</label>
  <div class="combo"><input id="uq" role="combobox" aria-expanded="false" aria-controls="uq-list" autocomplete="off"
    placeholder="Scegli o scrivi cognome, nome o login"><ul class="combo-list" id="uq-list" role="listbox"></ul></div></div>
<div class="f"><label for="note">3. Descrizione</label><textarea id="note" rows="4" maxlength="1500"
  placeholder="La prima riga diventa il titolo del ticket"></textarea></div>
<button class="btn ok" id="send" style="width:100%">Apri ticket</button>
</main>
<script src="/static/app.js"></script>
<script>
let loc = null, caller = null;

// Menu a tendina con ricerca: si apre al clic, filtra mentre si scrive (ricerca su GLPI),
// frecce + Invio per scegliere, Esc per chiudere. Modificare il testo annulla la scelta.
function combo(inputSel, url, key, onPick) {
  const input = $(inputSel), list = $(inputSel + "-list");
  let items = [], active = -1, timer, seq = 0, picked = null;
  const open = on => { list.style.display = on ? "block" : "none"; input.setAttribute("aria-expanded", on); };
  const render = (msg) => {
    list.replaceChildren(...(msg ? [h("li", { class: "combo-msg" }, msg)] : items.map((it, i) =>
      h("li", { role: "option", class: i === active ? "act" : "", onmousedown: ev => { ev.preventDefault(); choose(i); } }, it.name))));
    const a = list.querySelector(".act"); if (a) a.scrollIntoView({ block: "nearest" });
    open(true);
  };
  const load = async () => {
    const my = ++seq; render("Ricerca…");
    try {
      const r = await api(url + encodeURIComponent(picked ? "" : input.value.trim()));
      if (my !== seq) return;
      items = r[key]; active = items.length ? 0 : -1;
      render(items.length ? null : "Nessun risultato");
    } catch (e) { if (my === seq) render("Errore: " + e.message); }
  };
  const choose = i => {
    picked = items[i]; input.value = picked.name; input.classList.add("picked");
    onPick(picked); open(false);
  };
  input.addEventListener("focus", () => { input.select(); load(); });
  input.addEventListener("input", () => {
    if (picked) { picked = null; input.classList.remove("picked"); onPick(null); }
    clearTimeout(timer); timer = setTimeout(load, 250);
  });
  input.addEventListener("keydown", ev => {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (list.style.display !== "block") return load();
      if (!items.length) return;
      active = (active + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; render();
    } else if (ev.key === "Enter" && list.style.display === "block" && active >= 0) { ev.preventDefault(); choose(active); }
    else if (ev.key === "Escape") open(false);
  });
  input.addEventListener("blur", () => setTimeout(() => open(false), 150));
}
combo("#q", "/api/sites?q=", "sites", s => loc = s);
combo("#uq", "/api/users?q=", "users", u => caller = u);

$("#send").addEventListener("click", async () => {
  if (!loc) return toast("Scegli il sito");
  if (!caller) return toast("Scegli chi chiama");
  const note = $("#note").value.trim();
  if (note.length < 3) return toast("Scrivi la descrizione");
  const btn = $("#send"); btn.disabled = true;
  try {
    const r = await api("/api/call", { body: { location_id: loc.id, location_name: loc.name, caller_id: caller.id, note } });
    toast(`Ticket #${r.ticket_id} creato`, 2500);
    setTimeout(() => location.href = "/", 1200);
  } catch (e) { toast("Ticket NON creato: " + e.message, 7000); btn.disabled = false; }
});

header("call");
</script></body></html>
