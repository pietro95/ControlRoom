<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Room – Nuova chiamata</title><link rel="stylesheet" href="/static/style.css"><script src="/static/theme.js"></script></head>
<body><main style="max-width:760px">
<div class="f"><label for="q">1. Sito (scrivi codice o nome)</label>
  <input id="q" autocomplete="off" placeholder="es. FNC-IS00600 oppure Casaleno">
  <div class="sites" id="sites"></div><div class="chosen" id="chosen"></div></div>
<div class="f"><label for="uq">2. Chi chiama (utente GLPI: cognome, nome o login)</label>
  <input id="uq" autocomplete="off" placeholder="es. Bianchi">
  <div class="sites" id="users"></div><div class="chosen" id="uchosen"></div></div>
<div class="f"><label for="note">3. Descrizione</label><textarea id="note" rows="4" maxlength="1500"
  placeholder="La prima riga diventa il titolo del ticket"></textarea></div>
<button class="btn ok" id="send" style="width:100%">Apri ticket</button>
</main>
<script src="/static/app.js"></script>
<script>
let loc = null, caller = null;

// Ricerca con suggerimenti: input -> API -> bottoni; onPick riceve l'elemento scelto.
function picker(input, box, chosen, url, key, label, onPick) {
  let timer;
  $(input).addEventListener("input", () => {
    clearTimeout(timer);
    const v = $(input).value.trim();
    if (v.length < 2) { $(box).replaceChildren(); return; }
    timer = setTimeout(async () => {
      try {
        const r = await api(url + encodeURIComponent(v));
        const items = r[key];
        $(box).replaceChildren(...items.slice(0, 8).map(s => h("button", { class: "btn ghost", onclick: () => {
          onPick(s); $(box).replaceChildren(); $(input).value = "";
          const c = $(chosen); c.textContent = label + ": " + s.name; c.style.display = "block";
        } }, s.name)));
        if (!items.length) $(box).replaceChildren(h("div", { class: "meta" }, "Nessun risultato"));
      } catch (e) { toast("Ricerca non riuscita: " + e.message); }
    }, 250);
  });
}
picker("#q", "#sites", "#chosen", "/api/sites?q=", "sites", "Sito", s => loc = s);
picker("#uq", "#users", "#uchosen", "/api/users?q=", "users", "Chiamante", u => caller = u);

$("#send").addEventListener("click", async () => {
  if (!loc) return toast("Scegli il sito");
  if (!caller) return toast("Scegli chi chiama");
  const note = $("#note").value.trim();
  if (note.length < 3) return toast("Scrivi la descrizione");
  const btn = $("#send"); btn.disabled = true;
  try {
    const r = await api("/api/call", { body: { location_id: loc.id, location_name: loc.name, caller_id: caller.id, note } });
    toast(`Ticket #${r.ticket_id} creato`, 2500);
    setTimeout(() => location.href = "/", 1200);
  } catch (e) { toast("Ticket NON creato: " + e.message, 7000); btn.disabled = false; }
});

header("call");
</script></body></html>
