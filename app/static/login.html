<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Room – Accesso</title><link rel="stylesheet" href="/static/style.css"><script src="/static/theme.js"></script></head>
<body><form class="login" method="post" action="/login">
<div class="login-head">
<img class="logo logo-scuro" src="/static/img/logo/siciliacque_bianco.svg" alt="Siciliacque"><img class="logo logo-chiaro" src="/static/img/logo/siciliacque.svg" alt="">
<h1>Control Room</h1>
<p>Accedi con il tuo account aziendale</p>
</div>
<div class="err" role="alert">{{error}}</div>
<div class="f"><label for="u">Utente (account Windows)</label><input id="u" name="username" autocomplete="username" autofocus required></div>
<div class="f"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn">Accedi</button>
</form></body></html>
